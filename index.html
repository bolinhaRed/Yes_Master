<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sim, Mestre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#07090b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Grenze+Gotisch:wght@400;600;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: cemitério à noite em negativo — os desenhos a tinta tornam-se riscos de osso sobre breu; tabuleiro à esquerda iluminado pela lanterna, mesa do coveiro à direita (por baixo no telemóvel). */
:root{
  --breu:#07090b; --breu2:#0f1316; --breu3:#171c20;
  --osso:#e6dcc4; --osso2:#a39a86; --nevoa:#6d7a82;
  --vela:#e9a446; --sangue:#b02a1e; --musgo:#7d9a5e; --lodo:#4f8a85; --roxo:#9c6bd1;
  --f-tit:"Creepster","Grenze Gotisch",Georgia,serif;
  --f-cab:"Grenze Gotisch",Georgia,serif;
  --f-txt:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--breu);color:var(--osso);font-family:var(--f-txt);font-size:16.5px;line-height:1.55;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--breu)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px dashed var(--vela);outline-offset:3px}
#nevoa{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#relampago{position:fixed;inset:0;z-index:80;pointer-events:none;background:#dfe8ff;opacity:0}
#ceu{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.morcego{position:absolute;left:0;top:0;width:46px;height:24px;color:#020304;filter:drop-shadow(0 0 2px rgba(200,210,230,.25))}
.morcego svg{width:100%;height:100%;animation:bate .16s linear infinite alternate;transform-origin:50% 60%}
@keyframes bate{from{transform:scaleY(1)}to{transform:scaleY(-.55)}}
.olhos{position:absolute;display:flex;gap:9px;pointer-events:none;z-index:6}
.olhos i{width:9px;height:5px;border-radius:50%;background:#ffcf6a;box-shadow:0 0 8px 2px rgba(255,140,40,.8)}
.olhos.verdes i{background:#cfff8a;box-shadow:0 0 8px 2px rgba(120,255,90,.7)}

.app{position:relative;z-index:2;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

/* ---------- Ecrã de entrada ---------- */
#entrada{max-width:1100px;margin:0 auto;padding-top:18px}
.capa{display:grid;grid-template-columns:1fr;align-items:end;gap:0;position:relative}
.capa .mestre{width:min(560px,92%);justify-self:center;opacity:.92;filter:drop-shadow(0 0 30px rgba(140,160,180,.12));animation:respira 7s ease-in-out infinite;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
@keyframes respira{50%{transform:translateY(3px) scale(1.006);opacity:.8}}
.capa h1{font-family:var(--f-tit);font-weight:400;font-size:clamp(3.6rem,13vw,7.4rem);line-height:.9;margin:-.5em 0 0;text-align:center;color:var(--osso);letter-spacing:.02em;text-shadow:0 0 18px rgba(176,42,30,.45),0 4px 0 #000;text-wrap:balance}
.capa h1 span{color:var(--sangue)}
.capa .sub{font-family:var(--f-txt);font-style:italic;text-align:center;color:var(--osso2);margin:10px auto 0;max-width:44ch;font-size:1.08rem}
.porta{display:flex;justify-content:center;margin:26px 0 8px}
.btn{background:transparent;border:1.5px solid var(--osso2);color:var(--osso);border-radius:2px;padding:10px 18px;min-height:46px;font-family:var(--f-cab);font-size:1.15rem;letter-spacing:.02em;transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--osso);background:rgba(230,220,196,.07)}
.btn.prim{background:var(--osso);color:var(--breu);border-color:var(--osso)}
.btn.prim:hover{background:#fff4dc}
.btn.sangue{border-color:var(--sangue);color:#f3b8ae}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.grande{font-size:1.5rem;padding:12px 30px}
.aviso{font-size:.88rem;color:var(--nevoa);text-align:center;font-style:italic}

.menu{margin-top:22px}
.menu h2,.secao h2{font-family:var(--f-cab);font-weight:600;font-size:1.6rem;margin:0 0 10px;color:var(--osso)}
.mapas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.carta{position:relative;text-align:left;background:var(--breu2);border:1px solid #2a3136;border-radius:2px;padding:0;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .2s,transform .2s}
.carta:hover:not([disabled]){border-color:var(--osso2);transform:translateY(-2px)}
.carta .vista{height:120px;background-size:120% auto;background-position:50% 100%;background-repeat:no-repeat;opacity:.55;border-bottom:1px solid #2a3136;position:relative}
.carta .vista::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--breu2))}
.carta .info{padding:10px 14px 14px;display:flex;flex-direction:column;gap:4px}
.carta .nr{font-family:var(--f-cab);font-size:.85rem;color:var(--nevoa);letter-spacing:.08em;text-transform:uppercase}
.carta b{font-family:var(--f-cab);font-weight:600;font-size:1.42rem;line-height:1.1}
.carta small{color:var(--osso2);font-size:.88rem;line-height:1.35}
.carta .rec{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.88rem;color:var(--osso2);font-variant-numeric:tabular-nums}
.estrelas{display:inline-flex;gap:3px}.estrelas i{width:15px;height:17px;background:#2b3236;clip-path:polygon(50% 0,62% 12%,62% 35%,100% 35%,100% 52%,62% 52%,62% 100%,38% 100%,38% 52%,0 52%,0 35%,38% 35%,38% 12%)}
.estrelas i.on{background:var(--vela);filter:drop-shadow(0 0 4px rgba(233,164,70,.6))}
.carta[disabled]{cursor:not-allowed}.carta[disabled] .vista,.carta[disabled] .info{opacity:.35}
.carta .cadeado{position:absolute;top:10px;right:12px;font-family:var(--f-cab);font-size:.85rem;color:var(--osso2);background:var(--breu);padding:2px 8px;border:1px solid #2a3136}
.carta.diaria{border-color:#4a2420}.carta.diaria .nr{color:#e48c7f}
.opcoes-menu{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:.95rem;color:var(--osso2);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--vela)}

.secao{margin-top:30px;border-top:1px solid #20272b;padding-top:18px}
.regras{max-width:860px}
.regras p,.regras li{max-width:68ch;color:#d4cab3}
.regras h3{font-family:var(--f-cab);font-weight:600;font-size:1.25rem;margin:18px 0 4px}
.metodos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:12px 0}
.metodo{border:1px solid #2a3136;padding:10px 12px;background:var(--breu2);min-width:0}
.metodo img{width:100%;height:74px;object-fit:contain;opacity:.9}
.metodo b{font-family:var(--f-cab);font-size:1.2rem;font-weight:600;display:block;margin-top:4px}
.metodo b em{font-style:normal;color:var(--vela);margin-right:6px}
.metodo span{font-size:.92rem;color:var(--osso2);line-height:1.4;display:block}
.marcas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px;margin:10px 0;padding:0;list-style:none}
.marcas li{display:flex;gap:10px;align-items:center;font-size:.93rem}
.ico{display:inline-block;width:30px;height:32px;flex:none;background:var(--osso);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}

/* ---------- Jogo ---------- */
#jogo{max-width:1260px;margin:0 auto}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:8px 0;background:linear-gradient(var(--breu) 75%,rgba(7,9,11,0));flex-wrap:wrap}
.barra .titulo{font-family:var(--f-cab);font-weight:800;font-size:1.25rem;letter-spacing:.02em;white-space:nowrap}
.barra .titulo small{font-weight:400;color:var(--nevoa);font-size:.95rem;margin-left:6px}
.barra .dir{margin-left:auto;display:flex;gap:6px;align-items:center}
.ib{background:transparent;border:1px solid #2f373c;border-radius:2px;min-width:42px;min-height:42px;display:inline-grid;place-items:center;padding:0 10px;font-family:var(--f-cab);font-size:1rem;color:var(--osso2)}
.ib:hover{color:var(--osso);border-color:var(--osso2)}
.ib svg{width:20px;height:20px}
.ib.off{opacity:.5}

.mesa{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media (min-width:980px){.mesa{grid-template-columns:minmax(0,1fr) 370px}.painel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px)}}

.tabuleiro{position:relative;overflow:hidden;width:100%;border-radius:2px;background:radial-gradient(ellipse at 50% 55%,#11171a 0%,#080a0c 70%);box-shadow:0 0 0 1px #161b1e,0 30px 60px rgba(0,0,0,.6);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.moldura{position:absolute;left:0;top:0}
.moldura>img{position:absolute;inset:0;width:100%;height:100%;opacity:.62;pointer-events:none}
.grelha{position:absolute;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.grelha .borda{position:absolute;inset:-3px;border:3px solid rgba(230,220,196,.55);pointer-events:none;border-radius:2px;filter:url(#tremido)}
.cel{position:relative;border-right:1px dashed rgba(230,220,196,.17);border-bottom:1px dashed rgba(230,220,196,.17)}
.cel.cav{background:radial-gradient(ellipse at 50% 45%,#2a2018 0%,#1b140e 60%,#120d09 100%);box-shadow:inset 0 2px 6px rgba(0,0,0,.9)}
.cel.lodo{background:rgba(79,138,133,.06)}
.cel .i{position:absolute;inset:6%;background:var(--c,var(--osso));-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;pointer-events:none}
.cel .i.obst{opacity:.85}
.cel .i.corpo{filter:drop-shadow(0 0 5px var(--c,rgba(230,220,196,.7)))}
.cel .i.novo{animation:ergue 1.3s cubic-bezier(.2,.8,.3,1) both}
@keyframes ergue{from{transform:translateY(40%) scaleY(.2);opacity:0}70%{opacity:1}to{transform:none;opacity:1}}
.cel .i.podre{opacity:.75}
.cel .i.colhe{animation:colhe .9s ease-out forwards}
@keyframes colhe{0%{transform:scale(1);opacity:1}40%{transform:scale(1.45) translateY(-10%);opacity:1}100%{transform:scale(.4) translateY(-60%);opacity:0}}
.rotulos-c,.rotulos-l{position:absolute;display:grid;font-family:var(--f-cab);color:rgba(230,220,196,.6);font-size:clamp(.7rem,1.6vw,1rem);pointer-events:none;text-align:center}
.rotulos-c{grid-template-columns:repeat(10,1fr)}
.rotulos-l{grid-template-rows:repeat(10,1fr);align-items:center}
.pantano-img{position:absolute;pointer-events:none;opacity:.8}
svg.rasto{position:absolute;overflow:visible;pointer-events:none}
.escuro{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--lx,50%) var(--ly,90%),rgba(255,190,110,.10) 0,rgba(255,170,90,.05) 7%,rgba(3,4,6,.0) 13%,rgba(3,4,6,.42) 34%,rgba(3,4,6,.6) 75%);animation:chama 3.2s infinite;transition:--lx 1s}
@keyframes chama{0%,100%{opacity:1}22%{opacity:.88}25%{opacity:.97}61%{opacity:.9}64%{opacity:1}}
.brumas{position:absolute;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(ellipse 60% 25% at 20% 70%,rgba(140,160,170,.13),transparent 70%),radial-gradient(ellipse 50% 22% at 80% 40%,rgba(140,160,170,.11),transparent 70%);background-size:200% 100%;animation:deriva 38s linear infinite}
@keyframes deriva{from{background-position:0 0,100% 0}to{background-position:200% 0,-100% 0}}
.camada-alvos{position:absolute;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.alvo{border:0;background:transparent;padding:0;position:relative;min-width:0}
.alvo.sim::after{content:"";position:absolute;inset:16%;border:2px solid var(--vela);border-radius:50%;box-shadow:0 0 10px rgba(233,164,70,.6),inset 0 0 8px rgba(233,164,70,.4);animation:pulsa 1.4s ease-in-out infinite}
.alvo.sim.esc::after{inset:6%;border-radius:3px;background:rgba(233,164,70,.18);animation:none}
.alvo.ver::before{content:"";position:absolute;inset:0;background:rgba(233,164,70,.17);outline:1px solid rgba(233,164,70,.5)}
.alvo.ver.morto::before{background:rgba(176,42,30,.2);outline-color:rgba(176,42,30,.7)}
@keyframes pulsa{50%{transform:scale(.8);opacity:.55}}
.cabeca{position:absolute;width:3.2%;aspect-ratio:1;border-radius:50%;background:#ffd890;box-shadow:0 0 10px 4px rgba(255,170,70,.75),0 0 28px 10px rgba(255,140,50,.35);transform:translate(-50%,-50%);pointer-events:none;transition:left .5s ease,top .5s ease;animation:pisca 2.3s infinite}
@keyframes pisca{30%{box-shadow:0 0 8px 3px rgba(255,170,70,.6),0 0 22px 8px rgba(255,140,50,.25)}33%{box-shadow:0 0 12px 5px rgba(255,170,70,.85),0 0 32px 12px rgba(255,140,50,.4)}}
.tabuleiro .faixa-noite{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;font-family:var(--f-tit);font-size:clamp(2.4rem,8vw,4.8rem);color:var(--osso);text-shadow:0 0 22px rgba(0,0,0,1),0 0 40px rgba(176,42,30,.5);opacity:0}
.tabuleiro .faixa-noite small{display:block;font-family:var(--f-txt);font-style:italic;font-size:clamp(1rem,2.6vw,1.3rem);color:var(--osso2);margin-top:4px}
.tabuleiro .faixa-noite.mostra{animation:faixa 3.2s ease forwards}
@keyframes faixa{0%{opacity:0;transform:scale(1.08);filter:blur(6px)}18%{opacity:1;transform:none;filter:none}78%{opacity:1}100%{opacity:0}}

.painel{display:flex;flex-direction:column;gap:14px;min-width:0}
.bloco{background:linear-gradient(var(--breu2),rgba(15,19,22,.92));border:1px solid #22292e;padding:14px 14px 16px;min-width:0}
.bloco h3{margin:0 0 8px;font-family:var(--f-cab);font-weight:600;font-size:1.12rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bloco h3 small{font-family:var(--f-txt);font-weight:400;font-size:.85rem;color:var(--nevoa);font-style:italic}
.estado{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.estado .lab{font-family:var(--f-cab);font-size:.95rem;color:var(--osso2)}
.caixoes{display:flex;flex-wrap:wrap;gap:4px}
.caixoes i{width:16px;height:24px;clip-path:polygon(30% 0,70% 0,100% 22%,78% 100%,22% 100%,0 22%);background:#2a3136;position:relative}
.caixoes i.on{background:var(--osso);box-shadow:0 0 6px rgba(230,220,196,.5)}
.caixoes i.divida{background:#5a1f19}
.caixoes i.divida.on{background:#e7836f}
.caixoes i.extra{background:var(--vela)}
.velas{display:flex;gap:8px;align-items:flex-end}
.vela{width:12px;height:28px;position:relative;background:linear-gradient(90deg,#cdbf9f,#efe5cc 45%,#b9ab8a);border-radius:2px 2px 1px 1px}
.vela::before{content:"";position:absolute;left:50%;top:-13px;width:8px;height:12px;margin-left:-4px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3c4,#ffb347 55%,rgba(255,120,30,0) 72%);animation:labareda .4s infinite alternate;filter:drop-shadow(0 0 5px #ff9a3c)}
.vela.apagada{opacity:.45}
.vela.apagada::before{background:none;filter:none;width:2px;margin-left:-1px;height:8px;top:-8px;background:#444;animation:none}
.vela.extra{background:linear-gradient(90deg,#9f8db6,#d7c9ee 45%,#8a78a3)}
@keyframes labareda{from{transform:scaleY(1) skewX(-3deg)}to{transform:scaleY(1.15) skewX(4deg)}}
.moedas{font-family:var(--f-cab);font-size:1.5rem;color:var(--vela);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.moedas i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe6a8,#c4862f 60%,#7a4e15);box-shadow:0 0 6px rgba(233,164,70,.5)}
.moedas.tira{animation:abana .5s}
@keyframes abana{25%{transform:translateX(-4px);color:var(--sangue)}75%{transform:translateX(4px)}}

.dados{display:flex;gap:14px;justify-content:center;margin:2px 0 12px;min-height:66px}
.dado{width:62px;height:62px;border-radius:10px;background:radial-gradient(circle at 30% 25%,#f4ead3,#d8c9a6 60%,#a8977a);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.6);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;border:0;position:relative}
.dado i{width:11px;height:11px;border-radius:50%;background:#1a0f0c;place-self:center;visibility:hidden;box-shadow:inset 0 2px 2px rgba(0,0,0,.6)}
.dado i.on{visibility:visible}
.dado.sangue i.on{background:var(--sangue)}
.dado.rola{animation:rola .7s cubic-bezier(.3,.7,.4,1)}
@keyframes rola{0%{transform:translate(-30px,-24px) rotate(-200deg) scale(.6);opacity:0}60%{transform:translate(4px,2px) rotate(20deg) scale(1.05);opacity:1}100%{transform:none}}
.dado.pode-relancar{cursor:pointer;outline:1px dashed var(--vela);outline-offset:4px}
.dado.vazio{background:transparent;border:1.5px dashed #3a4247;box-shadow:none}
.escolhas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opc{background:var(--breu);border:1px solid #333b40;padding:8px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;transition:border-color .2s,background .2s}
.opc:hover:not([disabled]){border-color:var(--vela)}
.opc.sel{border-color:var(--vela);background:rgba(233,164,70,.09)}
.opc img{width:100%;height:46px;object-fit:contain;opacity:.9}
.opc b{font-family:var(--f-cab);font-weight:600;font-size:1.15rem;line-height:1.1}
.opc span{font-size:.82rem;color:var(--osso2)}
.opc em{font-style:normal;font-size:.78rem;color:var(--nevoa)}
.opc em.zero{color:#e48c7f}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acoes .btn{flex:1 1 auto}
.dica{font-size:.93rem;color:var(--osso2);margin:10px 0 0;min-height:1.4em}
.dica b{color:var(--osso)}
.variante{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;font-size:.9rem;color:var(--osso2)}

.lista-corpos{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.lista-corpos li{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-cab);font-size:1rem;border:1px solid #2a3136;padding:1px 8px 1px 2px;min-height:30px}
.lista-corpos li .ico{width:20px;height:24px}
.lista-corpos li.feito{opacity:.4;text-decoration:line-through}
.semana{margin-top:10px;font-size:.88rem;color:var(--nevoa);display:grid;gap:3px}
.semana div{display:flex;gap:6px;flex-wrap:wrap}
.semana b{font-family:var(--f-cab);color:var(--osso2);font-weight:400;min-width:54px}
.diario{max-height:180px;overflow:auto;font-size:.9rem;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;color:#cfc5ad}
.diario p{margin:0}
.diario p.mestre{font-style:italic;color:#e48c7f}
.diario p.bom{color:#e6dcc4}
.diario p.mau{color:#e48c7f}
.diario p.frio{color:var(--nevoa)}

/* ---------- Diálogos ---------- */
.veu{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 40%,rgba(10,12,14,.82),rgba(2,3,4,.96));display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));animation:aparece .5s ease}

<script>
/* ===================== DADOS ===================== */
const COLS='ABCDEFGHIJ';
const QUOTA=[3,4,5,6,7];
const TURNOS=4;
const MARCAS={
  corpo:{nome:'Corpo',txt:'Vale 1 corpo.',c:'var(--osso)'},

};
const OBST={arvore:'Árvore morta',poco:'Poço',cripta:'Cripta',anjo:'Anjo de pedra',tronco:'Tronco caído',silvas:'Silvas',grade:'Grade partida'};

  {n:'Reta',img:'m-reta',txt:'Uma linha reta a partir da lanterna, a distância toda.'},
  {n:'Curva',img:'m-curva',txt:'Um caminho a partir da lanterna, com uma só curva.'},
  {n:'Túnel',img:'m-tunel',txt:'Passa por baixo de tudo, em linha reta, e sai na última casa. Só essa casa conta.'},
  {n:'Divisão',img:'m-divisao',txt:'Dois braços retos a partir da lanterna que somam a distância. A lanterna fica numa ponta; a outra é beco sem saída.'},
  {n:'Ramo',img:'m-ramo',txt:'Um ramo reto que sai de qualquer ponto da tua vala. A lanterna não se mexe. Não podes ramificar de um ramo.'},
  {n:'Horas extra',img:'m-extra',txt:'Uma reta e, a seguir, um turno de borla. Se voltares a escolher o 6 nesse turno, é só uma reta.'}
];
const MAPAS=[
  {id:'portao-oco',nome:'Portão Oco',nr:'Mapa I',moldura:1,
   desc:'O cemitério velho da vila. Uma cripta, um poço sem fundo e um anjo que não tira os olhos de ti.',
   obst:{C6:'arvore',G7:'cripta',E4:'poco',H3:'anjo'},
   noites:[['B3','D3','G4','E2'],['B5','D5','F5:rico','H5','C4','G6'],['B6','D6','F6','H6','J6','A7','E7:maldito','I7'],
     ['A8','C8:rico','E8','G8:maldito','I8','B9','F9','D7'],['A10','C10','E10','G10','I10','D9','H9','J8','F8']]},
  {id:'agua-morta',nome:'Água Morta',nr:'Mapa II',moldura:2,
   desc:'Um pântano em forma de cruz engole as campas. Só o Túnel passa por baixo do lodo.',
   obst:{B5:'arvore',I5:'arvore',I8:'tronco',I2:'tronco'},
   lodo:['F7','D6','E6','F6','E5','F5','G5','E4','F4','E3','F3'],
   noites:[['B2','C2','A3','B4'],['D5:afundado','A6','B7','A9','C9','A10'],['D7','E7:afundado','C8','D9:monstro','G9','E10','G10','H10'],
     ['J10','I9:monstro','J8','G7','I7','J7','G6:afundado','H6'],['J5','G4','J4','G3','I3','H2','J2','I1','J1']]},
  {id:'portao-torto',nome:'Portão Torto',nr:'Mapa III',moldura:3,
   desc:'Uma fila de árvores parte o cemitério ao meio. Covas duplas e fantasmas que te roubam as moedas.',
   obst:{F10:'arvore',F9:'tronco',F8:'arvore',F7:'arvore',H7:'grade',J7:'grade',C4:'silvas',C3:'silvas',F4:'tronco',F3:'arvore'},
   noites:[['G1','I1','G3','J3'],['A2','D2','D3','E3','B4','D4'],['A5','D5','E5:duplo','F6','G5','A6','C6:fantasma','D6'],
     ['I6','G7','J8:fantasma','G8','I8','I9','G10:duplo','H10'],['A7','E7','A8','C8','D8:fantasma','E8','D9','A10','C10:duplo']]}
];
const FALAS_NOITE=['Quero-os frescos.','Não me faças esperar.','A cave tem fome.','Cava fundo. Cava depressa.','Os vermes que esperem. Eu não.','Ouço-te a respirar. Despacha-te.'];
const FALAS_BOM=['Bom servo.','Hmm. Serve.','Ainda estão mornos.','Assim gosto.'];
const FALAS_MAU=['Falta-me carne.','Desiludes-me.','O porão está à tua espera.','Amanhã trazes os que faltam. E mais.'];

/* ===================== UTIL ===================== */
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='html')e.innerHTML=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(x,v===true?'':v)}for(const c of k.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const d6=()=>1+Math.floor(Math.random()*6);
const ix=(c,r)=>r*10+c;
const cOf=i=>i%10, rOf=i=>Math.floor(i/10);
const nomeCel=i=>COLS[cOf(i)]+(rOf(i)+1);
const parseCel=s=>{const c=COLS.indexOf(s[0]);const r=parseInt(s.slice(1),10)-1;return ix(c,r)};
const DIRS=[[0,1],[1,0],[0,-1],[-1,0]];
const step=(i,d,n=1)=>{const c=cOf(i)+DIRS[d][0]*n,r=rOf(i)+DIRS[d][1]*n;return(c<0||c>9||r<0||r>9)?-1:ix(c,r)};
const img=n=>`img/${n}.webp`;
const mascara=n=>`url(${img(n)})`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms*(window.__vel??1)));
const store={get(k,d){try{const v=localStorage.getItem('simmestre.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('simmestre.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('simmestre.'+k)}catch(e){}}};
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function semente(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}

/* ===================== NOITE MALDITA (diária) ===================== */
function mapaDiario(data){
  const R=semente('noite-maldita-'+data);
  const ri=n=>Math.floor(R()*n);
  const tipos=['arvore','tronco','silvas','grade','cripta','anjo','poco'];
  const proib=new Set([parseCel('F1'),parseCel('F2'),parseCel('E1'),parseCel('G1')]);
  const obst={};const usadas=new Set(proib);
  const nObst=6+ri(4);
  while(Object.keys(obst).length<nObst){const i=ix(ri(10),1+ri(9));if(usadas.has(i))continue;usadas.add(i);obst[nomeCel(i)]=tipos[ri(tipos.length)]}
  const especiais=['rico','maldito','duplo','fantasma'];
  const noites=[];const tam=[4,6,8,8,9];
  for(let n=0;n<5;n++){
    const lista=[];
    // corpos espalham-se cada noite mais para longe do portão
    let tent=0;
    while(lista.length<tam[n]&&tent<500){tent++;
      const r=Math.min(9,Math.max(0,Math.floor(R()*(4+n*1.6))+ (n>2?2:0)));const c=ri(10);const i=ix(c,r);
      if(usadas.has(i))continue;
      // não deixar corpos totalmente cercados
      let livres=0;for(let d=0;d<4;d++){const j=step(i,d);if(j>=0&&!obst[nomeCel(j)])livres++}
      if(livres<2)continue;
      usadas.add(i);lista.push(nomeCel(i))}
    const nEsp=n===0?0:1+ri(n>2?3:2);
    for(let k=0;k<nEsp;k++){const p=1+ri(lista.length-1);if(!lista[p].includes(':'))lista[p]+=':'+especiais[ri(especiais.length)]}
    noites.push(lista)}
  const moldura=1+ri(3);
  return {id:'diaria-'+data,nome:'Noite Maldita',nr:'Desafio de '+data.split('-').reverse().join('/'),moldura,diaria:true,
    desc:'Um cemitério novo a cada dia, igual para toda a gente. Uma partida por dia conta para o recorde.',obst,noites};
}

<script>
/* ===================== SOM: tudo sintetizado ===================== */
const Som=(()=>{
  let ctx=null,mestre,sfx,amb,rev,revIn,ruido,castanho,tick=null,proxEvento=0;
  const cfg={amb:store.get('amb',true),sfx:store.get('sfx',true)};
  const ventos=[];
  function iniciar(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ctx.destination);
    mestre=ctx.createGain();mestre.gain.value=.9;mestre.connect(comp);
    rev=ctx.createConvolver();rev.buffer=impulso(3.4,2.6);const revG=ctx.createGain();revG.gain.value=.55;rev.connect(revG);revG.connect(mestre);
    revIn=ctx.createGain();revIn.connect(rev);
    sfx=ctx.createGain();sfx.gain.value=cfg.sfx?1:0;sfx.connect(mestre);
    const sfxRev=ctx.createGain();sfxRev.gain.value=.35;sfx.connect(sfxRev);sfxRev.connect(revIn);
    amb=ctx.createGain();amb.gain.value=0;amb.connect(mestre);
    const ambRev=ctx.createGain();ambRev.gain.value=.5;amb.connect(ambRev);ambRev.connect(revIn);
    ruido=bufRuido(2,'branco');castanho=bufRuido(6,'castanho');
    ambiente();
    amb.gain.setTargetAtTime(cfg.amb?1:0,ctx.currentTime,1.5);
    proxEvento=ctx.currentTime+6;
    tick=setInterval(passo,350);
  }
  function impulso(dur,dec){const n=ctx.sampleRate*dur,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}return b}
  function bufRuido(dur,tipo){const n=ctx.sampleRate*dur,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);let u=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(tipo==='castanho'){u=(u+.02*w)/1.02;d[i]=u*3.5}else d[i]=w}return b}
  function fonte(buf,loop){const s=ctx.createBufferSource();s.buffer=buf;s.loop=!!loop;return s}
  function g(v=0){const x=ctx.createGain();x.gain.value=v;return x}
  function filtro(tipo,f,q=1){const x=ctx.createBiquadFilter();x.type=tipo;x.frequency.value=f;x.Q.value=q;return x}
  function pan(v=0){const p=ctx.createStereoPanner?ctx.createStereoPanner():null;if(p)p.pan.value=v;return p||g(1)}
  function liga(...n){for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1]}
  function osc(tipo,f){const o=ctx.createOscillator();o.type=tipo;o.frequency.value=f;return o}
  function env(gn,t,a,pico,d,fim=0.0001){gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(pico,t+a);gn.gain.exponentialRampToValueAtTime(fim,t+a+d)}
  // rajada de ruído filtrado
  function rajada(t,dur,f,q,pico,dest,tipo='bandpass',buf){const s=fonte(buf||ruido);const fl=filtro(tipo,f,q);const gg=g();env(gg,t,Math.min(.006,dur/3),pico,dur);liga(s,fl,gg,dest);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
  function tom(t,tipo,f0,f1,dur,pico,dest,a=.01){const o=osc(tipo,f0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);const gg=g();env(gg,t,a,pico,dur);liga(o,gg,dest);o.start(t);o.stop(t+a+dur+.05);return o}

  /* --- ambiente: vento, névoa, zumbido grave --- */
  function ambiente(){
    for(let k=0;k<2;k++){
      const s=fonte(castanho,true),bp=filtro('bandpass',380,.8),gg=g(.12),p=pan(k?.55:-.55);
      liga(s,bp,gg,p,amb);s.start(0,k*2.3);ventos.push({bp,gg})}
    const ar=fonte(ruido,true),hp=filtro('highpass',5200,.5),ga=g(.008);liga(ar,hp,ga,amb);ar.start();
    const lp=filtro('lowpass',240,.7),gz=g(.05);liga(lp,gz,amb);
    [[48.9,'sine'],[49.25,'sine'],[73.4,'triangle'],[97.6,'sine']].forEach(([f,t],i)=>{const o=osc(t,f);const gi=g(i===3?.25:1);liga(o,gi,lp);o.start()});
    const lfo=osc('sine',.06),lg=g(.025);liga(lfo,lg,gz.gain);lfo.start();
    // assobio do vento
    const as=fonte(ruido,true),abp=filtro('bandpass',900,14),ag=g(0);liga(as,abp,ag,amb);as.start();ventos.assobio={abp,ag};
  }
  function passo(){
    if(!ctx)return;const t=ctx.currentTime;
    ventos.forEach(v=>{v.bp&&v.bp.frequency.setTargetAtTime(rnd(180,750),t,2.2);v.gg&&v.gg.gain.setTargetAtTime(rnd(.05,.2),t,1.8)});
    if(Math.random()<.03&&ventos.assobio){const{abp,ag}=ventos.assobio;const f=rnd(600,1300);abp.frequency.setTargetAtTime(f,t,.6);abp.frequency.setTargetAtTime(f*rnd(.7,1.3),t+1.5,1.2);ag.gain.setTargetAtTime(rnd(.02,.05),t,.8);ag.gain.setTargetAtTime(0,t+2.5,1.2);
      ventos.forEach(v=>v.gg&&v.gg.gain.setTargetAtTime(rnd(.25,.38),t,.7))}
    if(cfg.amb&&t>proxEvento){proxEvento=t+rnd(11,26);evento()}
  }
  let ultimo='';
  function evento(){
    const lista=['morcegos','rastejar','porta','coruja','sussurro','correntes','passos','corvo','trovao','morcegos','rastejar','porta'];
    let e;do{e=pick(lista)}while(e===ultimo);ultimo=e;
    E[e]&&E[e]();
  }
  /* --- eventos assustadores --- */
  const E={
    morcegos(){const t=ctx.currentTime;const n=3+Math.floor(rnd(0,5));const ida=Math.random()<.5;
      for(let b=0;b<n;b++){const t0=t+rnd(0,1.3),dur=rnd(.8,1.5),p=pan(ida?-1:1);p.pan&&p.pan.linearRampToValueAtTime(ida?1:-1,t0+dur);const gb=g(1);liga(gb,p,amb);
        const ritmo=rnd(9,14);for(let x=t0;x<t0+dur;x+=1/ritmo){rajada(x,.045,rnd(700,1700),1.1,rnd(.12,.3),gb)}
        if(Math.random()<.6)for(let k=0;k<3;k++)tom(t0+rnd(0,dur),'sine',rnd(6500,8500),rnd(8000,9800),.035,.03,gb)}
      Visual.morcegos(n,ida)},
    rastejar(){const t=ctx.currentTime,dur=rnd(3,5);const p=pan(rnd(-1,1));p.pan&&p.pan.linearRampToValueAtTime(rnd(-1,1),t+dur);const ge=g(0);ge.gain.setValueAtTime(0,t);ge.gain.linearRampToValueAtTime(1,t+dur*.4);ge.gain.linearRampToValueAtTime(0,t+dur);liga(ge,p,amb);
      let x=t;while(x<t+dur){rajada(x,rnd(.03,.08),rnd(1100,2800),3,rnd(.06,.16),ge);if(Math.random()<.15)tom(x,'sine',rnd(120,180),70,.03,.12,ge);x+=rnd(.025,.11)}
      const s=fonte(castanho),lp=filtro('lowpass',420,1),gs=g();gs.gain.setValueAtTime(0,t);gs.gain.linearRampToValueAtTime(.35,t+dur/2);gs.gain.linearRampToValueAtTime(0,t+dur);liga(s,lp,gs,ge);s.start(t);s.stop(t+dur);
      Visual.olhos()},
    porta(){const t=ctx.currentTime+.05,dur=rnd(1.6,2.8);const p=pan(rnd(-.8,.8));const gp=g(.5);liga(gp,p,amb);
      const o=osc('sawtooth',rnd(18,26));const pts=[];for(let k=0;k<=8;k++)o.frequency.linearRampToValueAtTime(rnd(14,42),t+dur*k/8);
      const gs=g(0);gs.gain.setValueAtTime(0,t);gs.gain.linearRampToValueAtTime(.9,t+.2);gs.gain.setValueAtTime(.9,t+dur-.3);gs.gain.linearRampToValueAtTime(0,t+dur);
      o.connect(gs);[[680,10,1],[1450,14,.7],[2650,18,.4]].forEach(([f,q,v])=>{const b=filtro('bandpass',f,q);b.frequency.linearRampToValueAtTime(f*rnd(.85,1.2),t+dur);const gv=g(v);liga(gs,b,gv,gp)});o.start(t);o.stop(t+dur+.1);
      const tf=t+dur+.05;tom(tf,'sine',70,38,.7,.6,gp,.005);rajada(tf,.25,180,1,.5,gp,'lowpass',castanho);rajada(tf+.02,.02,3500,2,.15,gp)},
    coruja(){const t=ctx.currentTime;const p=pan(rnd(-.9,.9));const lp=filtro('lowpass',1100),gc=g(.5);liga(lp,gc,p,amb);
      [[0,.32,410,380],[.5,.18,400,385],[.78,.75,395,340]].forEach(([dt,d,f0,f1])=>{const o=osc('sine',f0);o.frequency.linearRampToValueAtTime(f1,t+dt+d);const v=osc('sine',5.5),vg=g(6);liga(v,vg,o.frequency);const gg=g();gg.gain.setValueAtTime(0,t+dt);gg.gain.linearRampToValueAtTime(.12,t+dt+.07);gg.gain.linearRampToValueAtTime(0,t+dt+d);liga(o,gg,lp);o.start(t+dt);v.start(t+dt);o.stop(t+dt+d+.1);v.stop(t+dt+d+.1)})},
    sussurro(){const t=ctx.currentTime,dur=rnd(1.6,3);const p=pan(pick([-1,-.7,.7,1]));const gw=g(1);liga(gw,p,amb);
      const s=fonte(ruido,true),hp=filtro('highpass',900),am=g(0);liga(s,hp,am);
      const formantes=[[700,1200],[400,2300],[300,2700],[500,900],[650,1700]];
      formantes.slice(0,2).forEach((_,k)=>{const b=filtro('bandpass',formantes[0][k],7),gb=g(.9);liga(am,b,gb,gw);let x=t;while(x<t+dur){b.frequency.linearRampToValueAtTime(pick(formantes)[k]*rnd(1.4,2.2),x);x+=rnd(.12,.25)}});
      let x=t;while(x<t+dur){am.gain.linearRampToValueAtTime(rnd(.05,.32),x+.04);am.gain.linearRampToValueAtTime(.01,x+rnd(.1,.19));x+=rnd(.14,.24)}

    sino(n=1){if(!ctx)return;const t=ctx.currentTime;for(let k=0;k<n;k++)sino(t+k*2.1,pick([116,123,128]))},

<script>
/* ===================== MOTOR DO JOGO ===================== */
let J=null; // estado da partida

function novaPartida(mapa,facil){
  const cel=Array.from({length:100},()=>({cav:false,tipo:null,obst:null,lodo:false,corpo:null,podre:false}));
  for(const[k,v]of Object.entries(mapa.obst))cel[parseCel(k)].obst=v;
  (mapa.lodo||[]).forEach(k=>cel[parseCel(k)].lodo=true);
  const ini=parseCel('F1');cel[ini].cav=true;cel[ini].tipo='vala';
  J={mapaId:mapa.id,diaria:!!mapa.diaria,facil:!!facil,noite:0,turnos:TURNOS,moedas:1,divida:0,castigo:0,
    cel,cabeca:ini,rasto:[],fase:'lancar',dados:[0,0],relancou:false,bonus:false,escolha:null,
    hoje:{entregues:0,ricos:0,colhidos:[]},resultados:[],pas:0,diario:[],seq:0,termina:null};
  iniciarNoite(true);
}
let _cacheD=null;
function mapaAtual(){if(J.diaria){if(!_cacheD||_cacheD.id!==J.mapaId)_cacheD=mapaDiario(J.mapaId.slice(7));return _cacheD}return MAPAS.find(m=>m.id===J.mapaId)}
function corposDaNoite(n){return mapaAtual().noites[n].map(s=>{const[c,t]=s.split(':');return{i:parseCel(c),t:t||'corpo'}})}
function quotaHoje(){return QUOTA[J.noite]+J.divida}

function escrever(txt,cls=''){J.diario.push({txt,cls});if(J.diario.length>60)J.diario.shift()}

function iniciarNoite(primeira){
  J.hoje={entregues:0,ricos:0,colhidos:[]};
  J.turnos=TURNOS;J.bonus=false;J.relancou=false;J.escolha=null;J.fase='lancar';
  if(J.castigo>0){const p=Math.min(J.castigo,J.turnos);J.turnos-=p;J.castigo-=p;escrever(`O monstro do pântano roubou-te ${p===1?'um turno':p+' turnos'} desta noite.`,'mau')}
  const novos=[];
  for(const b of corposDaNoite(J.noite)){
    const c=J.cel[b.i];
    if(c.cav){ // a cova já estava aberta: o corpo cai na vala
      aplicarCorpo(b.t,b.i,'A campa já estava aberta e o corpo caiu-te na vala. ');
    }else{c.corpo={t:b.t,noite:J.noite};novos.push(b.i)}
  }
  J.novos=novos;
  escrever(`«${pick(FALAS_NOITE)}» Quero ${quotaHoje()} ${quotaHoje()===1?'corpo':'corpos'} até ao amanhecer.`,'mestre');
}

function aplicarCorpo(t,i,prefixo=''){
  const h=J.hoje;let msg='';
  switch(t){
    case 'corpo':h.entregues+=1;msg='Mais um corpo.';break;
    case 'rico':h.entregues+=1;h.ricos+=1;msg='Corpo rico: paga mais ao amanhecer.';break;
    case 'duplo':h.entregues+=2;msg='Cova dupla: dois de uma vez.';break;
    case 'afundado':h.entregues+=3;msg='Corpo afundado: vale por três.';break;
    case 'maldito':{const antes=h.entregues;h.entregues=Math.max(0,h.entregues-1);msg=antes?'Amaldiçoado. Um dos teus corpos desfez-se em pó.':'Amaldiçoado. Por sorte não tinhas nada para perder.';break}
    case 'fantasma':{h.entregues+=1;const tirou=Math.min(4,J.moedas);J.moedas-=tirou;msg=`Um fantasma ganancioso levou ${tirou} ${tirou===1?'moeda':'moedas'}.`;J._tirou=true;break}
    case 'monstro':h.entregues+=1;J.castigo+=1;msg='O monstro do pântano agarrou-te o pé. Perdes um turno.';break;
  }
  h.colhidos.push({t,i});
  escrever(`${nomeCel(i)}: ${prefixo}${msg}`,t==='maldito'||t==='fantasma'||t==='monstro'?'mau':'bom');
  return t;
}

/* --- validação de casas --- */
function livre(i,porTunel){if(i<0)return false;const c=J.cel[i];if(c.cav||c.obst||c.podre||c.lodo)return false;if(c.corpo&&c.corpo.t==='afundado'&&!porTunel)return false;return true}
function raio(de,d,n){const r=[];for(let k=1;k<=n;k++){const j=step(de,d,k);if(!livre(j))return null;r.push(j)}return r}

/* Gera todas as escavações possíveis para (método, distância). Cada uma: {m, casas:[...], segs:[{pts,tipo}], cabeca, alvo, extra} */
function escavacoes(m,D,deBonus){
  const H=J.cabeca,out=[];
  const reta=(tipoM)=>{for(let d=0;d<4;d++){const r=raio(H,d,D);if(r)out.push({m:tipoM,casas:r,segs:[{pts:[H,...r],tipo:'vala'}],cabeca:r[r.length-1],alvo:r[r.length-1]})}};
  if(m===1||m===6){reta(m);if(m===6&&!deBonus)out.forEach(o=>o.extra=true)}
  else if(m===2){
    for(let d=0;d<4;d++){
      const r=raio(H,d,D);if(r)out.push({m,casas:r,segs:[{pts:[H,...r],tipo:'vala'}],cabeca:r[r.length-1],alvo:r[r.length-1]});
      for(let k=1;k<D;k++){const a=raio(H,d,k);if(!a)break;const canto=a[a.length-1];
        for(const d2 of [(d+1)%4,(d+3)%4]){const b=raio(canto,d2,D-k);if(b){const casas=[...a,...b];out.push({m,casas,segs:[{pts:[H,...casas],tipo:'vala'}],cabeca:b[b.length-1],alvo:b[b.length-1]})}}}
    }
  }else if(m===3){
    for(let d=0;d<4;d++){const j=step(H,d,D);if(livre(j,true))out.push({m,casas:[j],segs:[{pts:[H,j],tipo:'tunel'}],cabeca:j,alvo:j,tunel:true})}
  }else if(m===4){
    if(D>=2)for(let da=0;da<4;da++)for(let db=0;db<4;db++){if(da===db)continue;
      for(let a=1;a<D;a++){const A=raio(H,da,a),B=raio(H,db,D-a);if(!A||!B)continue;
        out.push({m,casas:[...B,...A],segs:[{pts:[H,...B],tipo:'vala',beco:true},{pts:[H,...A],tipo:'vala'}],cabeca:A[A.length-1],alvo:A[A.length-1]})}}
  }else if(m===5){
    const base=[];J.cel.forEach((c,i)=>{if(c.cav&&c.tipo!=='ramo')base.push(i)});
    for(const t of base)for(let d=0;d<4;d++){const r=raio(t,d,D);if(r)out.push({m,casas:r,segs:[{pts:[t,...r],tipo:'ramo',beco:true}],cabeca:H,alvo:r[r.length-1],ramo:true})}
  }
  return out;
}
/* Pá curta: 1 casa a partir da lanterna; se a lanterna estiver cercada, a partir de qualquer ponto da vala */
function paCurta(){
  const out=[];const tenta=(de)=>{for(let d=0;d<4;d++){const j=step(de,d);if(livre(j))out.push({m:0,casas:[j],segs:[{pts:[de,j],tipo:'vala'}],cabeca:j,alvo:j,pa:true})}};
  tenta(J.cabeca);
  if(!out.length)J.cel.forEach((c,i)=>{if(c.cav&&c.tipo!=='ramo')tenta(i)});
  return out;
}
</script>

  }
  menu.append(el('h2',{},'Escolhe o cemitério'));

  for(const b of corposDaNoite(J.noite)){const c=J.cel[b.i];const feito=!c.corpo&&!c.podre;lst.append(el('li',{class:feito?'feito':'',title:MARCAS[b.t].nome+': '+MARCAS[b.t].txt},el('i',{class:'ico',style:`--m:${mascara(b.t)};background:${MARCAS[b.t].c}`}),nomeCel(b.i)))}
  const blocoC=el('div',{class:'bloco'},el('h3',{},'Corpos desta noite',el('small',{},J.facil?'juramento quebrado':'o resto da semana é segredo')),lst);
  if(J.facil){const sem=el('div',{class:'semana'});m.noites.forEach((n,k)=>{if(k>J.noite)sem.append(el('div',{},el('b',{},`Noite ${k+1}`),n.map(s=>s.replace(':',' ').replace(/ (\w+)/,(x,t)=>' ('+MARCAS[t].nome.toLowerCase()+')')).join(', ')))});blocoC.append(sem)}
  P.append(blocoC);
  // diário
  const di=el('div',{class:'diario'});J.diario.slice(-30).forEach(d=>di.prepend(el('p',{class:d.cls},d.txt)));
  P.append(el('div',{class:'bloco'},el('h3',{},'Diário do coveiro'),di));
}

/* ---------- Ações ---------- */
async function lancar(){
  if(J.fase!=='lancar')return;
  J.dados=[d6(),d6()];J.relancou=false;J.escolha=null;J.prev=null;J.opcoes=null;J.fase='escolher';J._rolou=true;
  Som.toca('dados');render();guardar();
}
function relancar(k){
  if(J.fase!=='escolher'&&J.fase!=='apontar')return;if(J.relancou||J.moedas<4)return;
  J.moedas-=4;J.relancou=true;J.dados[k]=d6();J.escolha=null;J.prev=null;J.opcoes=null;J.fase='escolher';J._rolou=true;
  escrever(`Pagaste 4 moedas para relançar. Saiu ${J.dados[k]}.`,'frio');Som.toca('moeda');Som.toca('dados');render();guardar();
}
function escolher(m,D){
  if(J.fase!=='escolher'&&J.fase!=='apontar')return;
  J.escolha=[m,D];J.opcoes=escavacoes(m,D,J.bonus);J.prev=null;J.hover=null;J.fase='apontar';Som.toca('clique');render();
}
function usarPa(){J.escolha.pa=true;J.opcoes=paCurta();J.prev=null;J.hover=null;Som.toca('clique');render()}
function clicaCasa(i){
  if(J.fase!=='apontar'||!J.opcoes)return;
  const op=J.opcoes.filter(o=>o.alvo===i);if(!op.length)return;
  if(J.prev&&J.prev.alvo===i){cavar();return}
  J.prev=op[0];J.hover=null;Som.toca('clique');render();
  const b=$('#btnCavar');if(b&&innerWidth<980)b.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function sobreCasa(i){
  if(J.fase!=='apontar'||!J.opcoes||!matchMedia('(hover:hover)').matches)return;
  if(J.prev)return;const op=J.opcoes.find(o=>o.alvo===i)||null;if(op!==J.hover){J.hover=op;desenhaRasto();marcaAlvos()}
}
function saiTabuleiro(){if(J&&J.hover){J.hover=null;desenhaRasto();marcaAlvos()}}
function passarTurno(){escrever('Ficaste parado, de pá na mão, a ouvir a noite.','frio');fimDoTurno(false)}

async function cavar(){
  const o=J.prev;if(!o||J.fase!=='apontar')return;
  J.fase='cavando';J.prev=null;J.hover=null;renderPainel();marcaAlvos();desenhaRasto();
  const tipoVala=o.ramo?'ramo':'vala';
  if(o.tunel){Som.toca('tunel');await sleep(600)}
  // ordem de escavação: segmentos pela ordem guardada
  const segsFeitos=[];
  for(const s of o.segs){
    const seg={pts:[s.pts[0]],tipo:s.tipo,beco:false};J.rasto.push(seg);segsFeitos.push([seg,s]);
    const casas=s.tipo==='tunel'?[s.pts[s.pts.length-1]]:s.pts.slice(1);
    for(const i of casas){
      if(s.tipo==='tunel')seg.pts=s.pts.slice();else seg.pts.push(i);
      const c=J.cel[i];c.cav=true;c.tipo=tipoVala;
      Som.toca('cavar');
      let colheu=null;
      if(c.corpo){colheu=c.corpo.t;const d=REF.grelha.querySelector(`.cel[data-i="${i}"] .i`);if(d){d.classList.add('colhe');setTimeout(()=>d.remove(),900)}c.corpo=null;aplicarCorpo(colheu,i)}
      render();
      if(colheu){({rico:()=>{Som.toca('corpo');Som.toca('moeda')},maldito:()=>Som.toca('maldicao'),fantasma:()=>Som.toca('fantasma'),monstro:()=>Som.toca('monstro'),afundado:()=>{Som.toca('bolhas');Som.toca('corpo')}}[colheu]||(()=>Som.toca('corpo')))();await sleep(380)}
      await sleep(170);
    }
    seg.beco=!!s.beco;
  }
  J.cabeca=o.cabeca;
  if(o.pa)J.pas++;
  const extra=!!o.extra;
  render();
  fimDoTurno(extra);
}
function fimDoTurno(extra){
  if(!J.bonus){J.turnos--;while(J.castigo>0&&J.turnos>0){J.turnos--;J.castigo--;escrever('Perdeste um turno a fugir do monstro.','mau')}}
  J.dados=[0,0];J.escolha=null;J.opcoes=null;J.prev=null;J.relancou=false;
  if(extra){J.bonus=true;J.fase='lancar';escrever('Horas extra: tens um turno de borla.','bom');render();guardar();return}
  J.bonus=false;
  if(J.turnos<=0){amanhecer();return}
  J.fase='lancar';render();guardar();
}

/* ---------- Amanhecer ---------- */
async function amanhecer(){
  J.fase='amanhecer';render();
  const q=quotaHoje(),ent=J.hoje.entregues;
  const pagos=Math.min(ent,q)+J.hoje.ricos;
  const apodreceram=[];
  J.cel.forEach((c,i)=>{if(c.corpo){c.podre=true;apodreceram.push(i);c.corpo=null}});
  if(apodreceram.length){Som.toca('podre');render()}
  const cumpriu=ent>=q;
  J.moedas+=pagos;
  J.resultados.push({quota:q,entregues:ent,cumpriu,base:QUOTA[J.noite]});
  const faltam=cumpriu?0:q-ent;
  J.divida=faltam;
  escrever(`Amanhecer. Entregaste ${ent} de ${q}. Recebeste ${pagos} ${pagos===1?'moeda':'moedas'}.`+(apodreceram.length?` ${apodreceram.length} ${apodreceram.length===1?'corpo apodreceu':'corpos apodreceram'}.`:''),cumpriu?'bom':'mau');
  await sleep(700);
  Som.toca('sino',J.noite===4?3:1);
  if(J.noite===4){fimDePartida(cumpriu);return}
  dialogo(el('div',{class:'cartao'},
    el('img',{class:'mestre-peq',src:img('mestre'),alt:''}),
    el('h2',{class:cumpriu?'':'vermelho'},cumpriu?'Sim, Mestre.':'Faltam corpos.'),
    el('p',{class:'fala'},'«'+(cumpriu?pick(FALAS_BOM):pick(FALAS_MAU))+'»'),
    el('div',{class:'contas'},
      el('span',{},'Encomenda'),el('span',{},q),
      el('span',{},'Entregaste'),el('span',{},ent),
      el('span',{},'Moedas ganhas'),el('span',{},'+'+pagos),
      el('span',{},'Corpos que apodreceram'),el('span',{},apodreceram.length),
      el('span',{class:'tot'},'Dívida para amanhã'),el('span',{class:'tot'},faltam)),
    el('div',{class:'acoes'},el('button',{class:'btn prim',autofocus:true,onclick:()=>{fechaDialogo();J.noite++;iniciarNoite();render();anunciaNoite();guardar()}},`Começar a noite ${J.noite+2}`))));
  guardar();
}
function anunciaNoite(){
  const f=$('#faixa');if(!f)return;f.innerHTML='';f.append(`Noite ${J.noite+1}`,el('small',{},`O Mestre quer ${quotaHoje()} corpos`));f.classList.remove('mostra');void f.offsetWidth;f.classList.add('mostra');
  Som.toca('noite');
}
function pontuacao(){
  let p=0,aTempo=0;for(const r of J.resultados){p+=Math.min(r.entregues,r.quota)*10+Math.max(0,r.entregues-r.quota)*3;if(r.cumpriu)aTempo++}
  return{base:p,aTempo,moedas:J.moedas*2,bonusNoites:aTempo*10};
}
function fimDePartida(venceu){
  J.fase='fim';J.termina=venceu?'vitoria':'derrota';
  const pt=pontuacao();const total=pt.base+pt.moedas+pt.bonusNoites+(venceu?50:0);
  const todas=J.resultados.every(r=>r.cumpriu);
  let est=0;if(venceu){est=1;if(todas){est=2;if(J.moedas>=15&&!J.facil)est=3}}
  // estatísticas
  const e=estat();let recorde=false,desbloqueia=null;
  if(J.diaria){const d=e.diaria||{};const hoje=J.mapaId.slice(7);if(d.data!==hoje){d.data=hoje;d.pontos=total;d.estrelas=est;if(d.melhor==null||total>d.melhor){d.melhor=total;recorde=true}}e.diaria=d}
  else{const s=e[J.mapaId]||{jogos:0,vitorias:0};s.jogos++;if(venceu){if(!s.vitorias){const k=MAPAS.findIndex(m=>m.id===J.mapaId);if(MAPAS[k+1])desbloqueia=MAPAS[k+1].nome}s.vitorias++}
    if(s.melhor==null||total>s.melhor){s.melhor=total;recorde=true}s.estrelas=Math.max(s.estrelas||0,est);e[J.mapaId]=s}
  guardaEstat(e);store.del('partida');
  Som.toca(venceu?'vitoria':'derrota');
  const m=mapaAtual();
  dialogo(el('div',{class:'cartao'},
    el('img',{class:'mestre-peq',src:img('mestre'),alt:''}),
    el('h2',{class:venceu?'':'vermelho'},venceu?'Sim, Mestre.':'Para o porão.'),
    el('p',{class:'fala'},venceu?'«A semana está paga. Por agora.»':`«Faltaram-me ${J.divida} ${J.divida===1?'corpo':'corpos'}. Desce. A porta fecha-se por fora.»`),
    estrelasEl(est),
    el('div',{class:'contas'},
      el('span',{},'Corpos dentro da encomenda'),el('span',{},J.resultados.reduce((a,r)=>a+Math.min(r.entregues,r.quota),0)+' × 10'),
      el('span',{},'Corpos a mais'),el('span',{},J.resultados.reduce((a,r)=>a+Math.max(0,r.entregues-r.quota),0)+' × 3'),
      el('span',{},'Noites cumpridas a tempo'),el('span',{},pt.aTempo+' × 10'),
      el('span',{},'Moedas no bolso'),el('span',{},J.moedas+' × 2'),
      venceu?el('span',{},'Semana paga'):null,venceu?el('span',{},'+50'):null,
      el('span',{class:'tot'},recorde?'Pontos (novo recorde!)':'Pontos'),el('span',{class:'tot'},total)),
    desbloqueia?el('p',{},`Abriu-se um portão novo: `,el('b',{},desbloqueia),'.'):null,
    J.facil&&venceu&&todas?el('p',{class:'aviso'},'Com o juramento quebrado não há terceira estrela.'):null,
    el('div',{class:'acoes'},
      J.diaria?null:el('button',{class:'btn prim',onclick:()=>{fechaDialogo();comecar(m,J.facil)}},'Jogar outra vez'),
      el('button',{class:'btn',onclick:()=>{fechaDialogo();mostraEntrada()}},'Voltar ao portão'))));
}
function dialogo(conteudo){const d=$('#dialogo');d.innerHTML='';d.className='veu';d.hidden=false;d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.append(conteudo);const f=d.querySelector('[autofocus]')||d.querySelector('button');f&&setTimeout(()=>f.focus(),60)}
function fechaDialogo(){const d=$('#dialogo');d.hidden=true;d.innerHTML=''}

function guardar(){if(!J)return;if(J.fase==='fim'){store.del('partida');return}const c={...J};delete c.opcoes;delete c.prev;delete c.novos;if(c.fase==='apontar'||c.fase==='cavando'){c.fase=c.fase==='cavando'?'lancar':'escolher'}store.set('partida',c)}

/* teclado: espaço para lançar, Enter para cavar */
addEventListener('keydown',e=>{if(!J||$('#jogo').hidden||!$('#dialogo').hidden)return;if(e.target.closest('button,input'))return;
  if(e.code==='Space'&&J.fase==='lancar'){e.preventDefault();lancar()}
  else if(e.key==='Enter'&&J.fase==='apontar'&&J.prev){e.preventDefault();cavar()}});

/* ganchos de teste */
window.__sm={get J(){return J},escavacoes,paCurta,lancar,escolher,cavar,clicaCasa,usarPa,passarTurno,comecar,MAPAS,mapaDiario,fechaDialogo,Som,
};

const arranque=()=>mostraEntrada();
window.claude?.hot?.snapshot?.(()=>({}));
window.claude?.hot?.ready?window.claude.hot.ready(arranque):arranque();
</script>
